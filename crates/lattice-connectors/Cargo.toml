[package]
name = "lattice-connectors"
description = "Remote connector bindings (GitHub/GitLab Extract and shared OAuth)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
lattice-core.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ureq.workspace = true
# Cross-platform OS credential store (MIT/Apache-2.0). Optional at runtime:
# MemoryTokenStore is used in tests; KeychainTokenStore when available.
# keyring 3 defaults to an in-memory mock unless a platform backend is enabled.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
walkdir.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
