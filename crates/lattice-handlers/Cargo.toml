[package]
name = "lattice-handlers"
description = "Tauri-free workspace, page, search, and home handlers shared by the desktop shell and localhost bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-core.workspace = true
lattice-profile.workspace = true
lattice-commands.workspace = true
lattice-storage.workspace = true
lattice-index.workspace = true
lattice-runtime.workspace = true
lattice-embedding.workspace = true
lattice-connectors.workspace = true
lattice-cloud-client.workspace = true
lattice-workspace-crypto.workspace = true
lattice-sync.workspace = true
lattice-collab.workspace = true
latticefs-core.workspace = true
lattice-capture-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
getrandom = "0.3"
hex.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
tempfile = "3"
serde_json.workspace = true
yrs = "0.21"

[features]
default = []
keychain = ["lattice-workspace-crypto/keychain"]

[target.'cfg(target_os = "macos")'.dependencies]
lattice-apple-signin-macos = { workspace = true }
