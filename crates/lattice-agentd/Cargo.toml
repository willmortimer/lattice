[package]
name = "lattice-agentd"
description = "Opt-in Rust agentd sidecar speaking Phase A JSONL over stdio (ADR 0051/0066)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "lattice_agentd"
path = "src/lib.rs"

[[bin]]
name = "lattice-agentd"
path = "src/main.rs"

[[bin]]
name = "lattice-wasi-seatbelt"
path = "src/bin/lattice_wasi_seatbelt.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kernelfs.workspace = true
lattice-cell-client.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
base64.workspace = true
tempfile = "3"
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
wiremock = "0.6"
