[package]
name = "lattice-daemon"
description = "latticed: long-lived Lattice daemon over private IPC (UDS / named pipe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lattice_daemon"
path = "src/lib.rs"

[[bin]]
name = "latticed"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
dirs.workspace = true
lattice-client.workspace = true
lattice-cloud-client.workspace = true
lattice-commands.workspace = true
lattice-core.workspace = true
latticefs-core.workspace = true
lattice-datasets.workspace = true
lattice-duckdb.workspace = true
lattice-embed-host.workspace = true
lattice-embedding.workspace = true
lattice-handlers.workspace = true
lattice-index.workspace = true
lattice-lance.workspace = true
lattice-mcp-catalog.workspace = true
lattice-relay-protocol.workspace = true
lattice-profile.workspace = true
lattice-protocol.workspace = true
lattice-collab.workspace = true
lattice-runtime.workspace = true
lattice-voice.workspace = true
serde.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
lattice-voice-host.workspace = true

[dev-dependencies]
http-body-util = "0.1"
lattice-handlers.workspace = true
latticefs-core.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process"] }
tower = { version = "0.5", features = ["util"] }
