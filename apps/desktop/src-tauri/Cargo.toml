[package]
name = "lattice-desktop"
description = "Lattice desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "lattice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables the Playwright socket bridge for native WebView E2E / perf.
# Keep off for normal runs; use `pnpm tauri:dev:e2e` or `--features e2e-testing`.
e2e-testing = []
# Native mic capture + latticed thin client. Does not link FluidAudio;
# set LATTICE_VOICE_DAEMON=1 to require daemon-only operation.
# Top-level feature deps (Cargo ignores `target.*.features` for activation).
# Platform-optional crates are no-ops on the wrong target (same pattern as `capture`).
voice = [
    "dep:lattice-voice",
    "dep:lattice-audio",
    "dep:bytes",
    "dep:lattice-audio-macos",
    "lattice-audio-macos/link-bridge",
    "dep:lattice-audio-windows",
]
# Transitional in-process FluidAudio fallback when latticed/voice-host is down
# (macOS only). Production daemon-only builds: `--features voice` (omit
# voice-embedded).
voice-embedded = [
    "voice",
    "dep:lattice-voice-macos",
    "lattice-voice-macos/link-bridge",
]
# Voice is opt-in so Linux CI and machines without the Swift dylib still build.
# Dev with fallback (macOS): `cargo tauri dev --features voice-embedded`.
# Native screen capture (ScreenCaptureKit on macOS; Windows WGC): `--features capture`.
default = []
# Screen capture → Capture Inbox ingest + clipboard.
# Platform backends are optional target deps; enabling a missing-target dep is a no-op.
capture = [
    "dep:image",
    "dep:arboard",
    "dep:lattice-capture-macos",
    "lattice-capture-macos/link-bridge",
    "dep:lattice-capture-windows",
]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Always linked so `playwright:default` stays in the ACL schema; only initialized
# when the `e2e-testing` feature is enabled (see lib.rs).
tauri-plugin-playwright = "0.4.1"
lattice-theme.workspace = true
lattice-profile.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
lattice-core.workspace = true
lattice-commands.workspace = true
lattice-storage.workspace = true
lattice-index.workspace = true
lattice-data.workspace = true
lattice-datasets.workspace = true
lattice-duckdb.workspace = true
lattice-arrow-transport.workspace = true
lattice-handlers = { workspace = true, features = ["keychain"] }
lattice-cloud-client.workspace = true
lattice-connectors.workspace = true
lattice-runtime.workspace = true
latticefs-core.workspace = true
lattice-terminal.workspace = true
lattice-kernel.workspace = true
lattice-client.workspace = true
lattice-protocol.workspace = true
lattice-publish.workspace = true
arrow.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
tokio.workspace = true
dirs.workspace = true
uuid.workspace = true
ureq.workspace = true
# Optional: enabled by the `voice` / `voice-embedded` features (macOS only).
lattice-voice = { workspace = true, optional = true }
lattice-audio = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "webp"], optional = true }
arboard = { version = "3", optional = true }
# Always linked for permission stubs; platform backends enabled via target features.
lattice-capture-core.workspace = true
walkdir.workspace = true
url = "2"
sha2 = "0.10"
hex = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSError",
    "NSString",
    "NSNotification",
    "NSOperation",
] }
objc2-local-authentication = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow"] }
lattice-approval-macos = { workspace = true, features = ["link-bridge"] }
lattice-apple-signin-macos = { workspace = true, features = ["link-bridge"] }
lattice-voice-macos = { workspace = true, optional = true }
lattice-audio-macos = { workspace = true, optional = true }
lattice-capture-macos = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
lattice-capture-windows = { workspace = true, optional = true }
lattice-audio-windows = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.features]
# Historical weak-dep notes (Cargo ignores this section for feature activation).
# Real activation lives in the top-level `voice` / `voice-embedded` / `capture` features.
lattice-desktop = [
    "voice?/dep:lattice-voice",
    "voice?/dep:lattice-audio",
    "voice?/dep:lattice-audio-macos",
    "voice?/dep:bytes",
    "voice?/lattice-audio-macos/link-bridge",
    "voice-embedded?/dep:lattice-voice-macos",
    "voice-embedded?/lattice-voice-macos/link-bridge",
]

# NOTE: Cargo ignores `target.*.features` for package feature activation (see
# unused-manifest-key warnings). Voice + capture deps are wired via top-level
# features; platform-optional crates are no-ops on the wrong target.

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true }
