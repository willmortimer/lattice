[workspace]
resolver = "2"
members = [
    "apps/bridge",
    "apps/cli",
    "apps/daemon",
    "apps/embed-host",
    "apps/voice-host-macos",
    "crates/lattice-core",
    "crates/lattice-profile",
    "crates/lattice-storage",
    "crates/latticefs-core",
    "crates/lattice-commands",
    "crates/lattice-index",
    "crates/lattice-lance",
    "crates/lattice-embedding",
    "crates/lattice-data",
    "crates/lattice-datasets",
    "crates/lattice-duckdb",
    "crates/lattice-arrow-transport",
    "crates/lattice-theme",
    "crates/lattice-publish",
    "crates/lattice-handlers",
    "crates/lattice-runtime",
    "crates/lattice-terminal",
    "crates/lattice-env",
    "crates/lattice-kernel",
    "crates/lattice-voice",
    "crates/lattice-voice-macos",
    "crates/lattice-audio",
    "crates/lattice-audio-macos",
    "crates/lattice-capture-core",
    "crates/lattice-capture-macos",
    "crates/lattice-capture-windows",
    "crates/lattice-collab",
    "crates/lattice-protocol",
    "crates/lattice-client",
    "crates/lattice-connectors",
    "crates/lattice-cloud-client",
    "crates/lattice-cell-client",
    "crates/lattice-approval-macos",
    "crates/lattice-apple-signin-macos",
    "crates/lattice-agentd",
    "crates/lattice-mcp-catalog",
    "crates/lattice-relay-protocol",
    "crates/lattice-workspace-crypto",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
lattice-core = { path = "crates/lattice-core" }
lattice-profile = { path = "crates/lattice-profile" }
lattice-storage = { path = "crates/lattice-storage" }
latticefs-core = { path = "crates/latticefs-core" }
lattice-commands = { path = "crates/lattice-commands" }
lattice-index = { path = "crates/lattice-index" }
lattice-lance = { path = "crates/lattice-lance" }
lattice-embedding = { path = "crates/lattice-embedding" }
lattice-embed-host = { path = "apps/embed-host" }
lattice-voice-host = { path = "apps/voice-host-macos" }
lattice-data = { path = "crates/lattice-data" }
lattice-datasets = { path = "crates/lattice-datasets" }
lattice-duckdb = { path = "crates/lattice-duckdb" }
lattice-arrow-transport = { path = "crates/lattice-arrow-transport" }
lattice-theme = { path = "crates/lattice-theme" }
lattice-publish = { path = "crates/lattice-publish" }
lattice-handlers = { path = "crates/lattice-handlers" }
lattice-runtime = { path = "crates/lattice-runtime" }
lattice-terminal = { path = "crates/lattice-terminal" }
lattice-env = { path = "crates/lattice-env" }
lattice-kernel = { path = "crates/lattice-kernel" }
lattice-voice = { path = "crates/lattice-voice" }
lattice-voice-macos = { path = "crates/lattice-voice-macos" }
lattice-collab = { path = "crates/lattice-collab" }
lattice-audio = { path = "crates/lattice-audio" }
lattice-audio-macos = { path = "crates/lattice-audio-macos" }
lattice-capture-core = { path = "crates/lattice-capture-core" }
lattice-capture-macos = { path = "crates/lattice-capture-macos" }
lattice-capture-windows = { path = "crates/lattice-capture-windows" }
lattice-protocol = { path = "crates/lattice-protocol" }
lattice-client = { path = "crates/lattice-client" }
lattice-connectors = { path = "crates/lattice-connectors" }
lattice-cloud-client = { path = "crates/lattice-cloud-client" }
lattice-cell-client = { path = "crates/lattice-cell-client" }
lattice-approval-macos = { path = "crates/lattice-approval-macos" }
lattice-mcp-catalog = { path = "crates/lattice-mcp-catalog" }
lattice-relay-protocol = { path = "crates/lattice-relay-protocol" }
lattice-apple-signin-macos = { path = "crates/lattice-apple-signin-macos" }
lattice-workspace-crypto = { path = "crates/lattice-workspace-crypto" }
kernelfs = { path = "../kernelfs/crates/kernelfs" }
kernelfs-linux = { path = "../kernelfs/crates/kernelfs-linux" }
kernelfs-mac = { path = "../kernelfs/crates/kernelfs-mac" }
lattice-daemon = { path = "apps/daemon" }
prost = "0.14"
prost-build = "0.14"
tokio-util = { version = "0.7", features = ["codec"] }
# Cross-platform PTY for the embedded terminal (ADR 0039); WezTerm's portable-pty.
bytes = "1"
async-trait = "0.1"
portable-pty = "0.9"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
# Gitignore-style matching for `lattice.yaml` `ignore:` patterns (MIT/Unlicense).
ignore = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
wasmtime = "27"
wasmtime-wasi = "27"
# Apache Arrow / Parquet (Apache-2.0) for analytical dataset facts under `facts/`
# and Arrow IPC transport to the desktop (ADR 0021).
arrow = { version = "59.1", default-features = false, features = ["csv", "ipc"] }
parquet = { version = "59.1", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
] }
ureq = { version = "2", default-features = false, features = ["tls"] }
base64 = "0.22"
trash = "5"
dirs = "6"
# `macos_kqueue` (not the default FSEvents backend) avoids multi-second
# event-delivery latency observed under this repo's sandboxed macOS dev
# environment; kqueue talks to the kernel directly instead of through the
# fseventsd daemon. Behavior is equivalent to the default on Linux/Windows.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-full = { version = "0.7", default-features = false, features = [
    "macos_kqueue",
] }
