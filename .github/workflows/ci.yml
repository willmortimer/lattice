name: Client CI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: lattice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXR_AUTO_DAEMON: "0"
  CI: "true"
  # CI-only: do not infer this from CI=true inside flake apps.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 5G

jobs:
  plan:
    name: NXR CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout private kernelfs sibling
        env:
          TOKEN: ${{ secrets.KERNELFS_READ_TOKEN }}
        run: |
          set -euo pipefail
          SIBLING="$(dirname "$GITHUB_WORKSPACE")/kernelfs"
          if [ -z "${TOKEN:-}" ]; then
            echo "KERNELFS_READ_TOKEN is required (private willmortimer/kernelfs)." >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/willmortimer/kernelfs.git" \
            "$SIBLING"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-cache-action@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - uses: DeterminateSystems/flake-checker-action@main

      - name: Export ci plan → matrix
        id: matrix
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref || 'main' }}"
          PLAN_ARGS=(ci plan --json)
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            PLAN_ARGS+=(--base "$BASE")
          fi
          nix run .#nxr -- "${PLAN_ARGS[@]}" > /tmp/nxr-ci-plan.json
          MATRIX="$(python3 ./scripts/ci-plan-to-matrix.py /tmp/nxr-ci-plan.json)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "CI matrix: $MATRIX"

  project:
    name: ${{ matrix.task }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout private kernelfs sibling
        env:
          TOKEN: ${{ secrets.KERNELFS_READ_TOKEN }}
        run: |
          set -euo pipefail
          SIBLING="$(dirname "$GITHUB_WORKSPACE")/kernelfs"
          if [ -z "${TOKEN:-}" ]; then
            echo "KERNELFS_READ_TOKEN is required (private willmortimer/kernelfs)." >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/willmortimer/kernelfs.git" \
            "$SIBLING"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-cache-action@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Run leaf
        run: nix run .#nxr -- task "${{ matrix.task }}" -j 4

  join:
    name: CI join
    needs: [plan, project]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require project jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.project.result }}" != "success" ]; then
            echo "One or more leaves failed (${{ needs.project.result }})" >&2
            exit 1
          fi
