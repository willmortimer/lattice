name: Client CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lattice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXR_AUTO_DAEMON: "0"

jobs:
  plan:
    name: NXR CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout private kernelfs sibling
        env:
          TOKEN: ${{ secrets.KERNELFS_READ_TOKEN }}
        run: |
          set -euo pipefail
          SIBLING="$(dirname "$GITHUB_WORKSPACE")/kernelfs"
          if [ -z "${TOKEN:-}" ]; then
            echo "KERNELFS_READ_TOKEN is required (private willmortimer/kernelfs)." >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/willmortimer/kernelfs.git" \
            "$SIBLING"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-cache-action@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - uses: DeterminateSystems/flake-checker-action@main

      - name: Export ci plan → matrix
        id: matrix
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref || 'main' }}"
          PLAN_ARGS=(ci plan --json)
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            PLAN_ARGS+=(--base "$BASE")
          fi
          nix run .#nxr -- "${PLAN_ARGS[@]}" > /tmp/nxr-ci-plan.json
          # Prefer execution_plan roots/leaves; fall back to full `ci` sink.
          if command -v python3 >/dev/null; then
            MATRIX="$(python3 - <<'PY'
          import json
          plan = json.load(open("/tmp/nxr-ci-plan.json"))
          nodes = {n["id"] for n in plan.get("execution_plan", {}).get("nodes", [])}
          preferred = ["fmt", "clippy", "test", "js-check", "js-deps"]
          selected = [n for n in preferred if n in nodes]
          if not selected:
              selected = list(plan.get("roots") or ["ci"])
          print(json.dumps({"include": [{"task": t} for t in selected]}, separators=(",", ":")))
          PY
          )"
          else
            MATRIX='{"include":[{"task":"ci"}]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "CI matrix: $MATRIX"

  project:
    name: ${{ matrix.task }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout private kernelfs sibling
        env:
          TOKEN: ${{ secrets.KERNELFS_READ_TOKEN }}
        run: |
          set -euo pipefail
          SIBLING="$(dirname "$GITHUB_WORKSPACE")/kernelfs"
          if [ -z "${TOKEN:-}" ]; then
            echo "KERNELFS_READ_TOKEN is required (private willmortimer/kernelfs)." >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/willmortimer/kernelfs.git" \
            "$SIBLING"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/flakehub-cache-action@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Run leaf
        run: nix run .#nxr -- task "${{ matrix.task }}" -j 4

  join:
    name: CI join
    needs: [plan, project]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require project jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.project.result }}" != "success" ]; then
            echo "One or more leaves failed (${{ needs.project.result }})" >&2
            exit 1
          fi
